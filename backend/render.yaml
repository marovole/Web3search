# Render 部署配置
# 修复版本 - 解决 502 错误问题

services:
  # FastAPI Web Service
  - type: web
    name: web3search-api
    runtime: python
    plan: free
    region: oregon

    # 修复：使用正确的依赖安装命令
    buildCommand: cd backend && pip install -r requirements.txt

    # 启动命令
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # 健康检查
    healthCheckPath: /health

    # Python 版本
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"

      # 环境配置
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO

      # 安全配置 - 需要手动在 Render Dashboard 设置
      - key: JWT_SECRET_KEY
        sync: false
        description: "JWT Secret Key - Must be set manually (32+ characters)"
      - key: SIGNATURE_SECRET_KEY
        sync: false
        description: "API Signature Secret Key - Must be set manually (32+ characters)"
      - key: ENABLE_SIGNATURE_VERIFICATION
        value: "true"
      - key: CORS_ORIGINS
        value: "https://web3search.vercel.app,https://www.web3search.vercel.app"

      # API 配置 - 需要手动设置
      - key: OPENROUTER_API_KEY
        sync: false
        description: "OpenRouter API Key - Required for AI functionality"
      - key: SENTRY_DSN
        sync: false
        description: "Optional: Sentry DSN for error tracking"

      # 超时配置
      - key: CHAT_TIMEOUT
        value: "120"
      - key: RESEARCH_TIMEOUT
        value: "180"

      # 缓存配置
      - key: CACHE_TTL_HOURS
        value: "24"

# 数据库服务（免费计划）
databases:
  - name: web3search-postgres
    databaseName: web3search_production
    plan: free
    region: oregon
    postgresMajorVersion: 15

