# Load Testing Docker Environment
# 用于高并发负载测试的Docker配置

version: '3.8'

services:
  # Locust Master节点
  locust-master:
    build:
      context: .
      dockerfile: Dockerfile.locust
    command: locust -f locustfile.py --master --host=http://web:8000
    ports:
      - "8089:8089"
    environment:
      - LOCUST_MODE=master
      - TARGET_HOST=http://web:8000
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
    networks:
      - load-test-network
    depends_on:
      - web

  # Locust Worker节点 (可扩展)
  locust-worker:
    build:
      context: .
      dockerfile: Dockerfile.locust
    command: locust -f locustfile.py --worker --master-host=locust-master
    environment:
      - LOCUST_MODE=worker
      - MASTER_HOST=locust-master
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
    networks:
      - load-test-network
    depends_on:
      - locust-master
    deploy:
      replicas: 3  # 3个worker节点

  # Web应用服务 (被测试目标)
  web:
    build:
      context: ../../
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=testing
      - DATABASE_URL=postgresql://postgres:password@db:5432/web3search_test
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVICE_URL=http://ai-service:8001
    networks:
      - load-test-network
    depends_on:
      - db
      - redis
      - ai-service

  # 数据库服务
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=web3search_test
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - load-test-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  # Redis缓存服务
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - load-test-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # AI服务模拟
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai-service
    ports:
      - "8001:8001"
    environment:
      - SERVICE_MODE=mock
      - RESPONSE_DELAY=1-3  # 模拟1-3秒响应延迟
    networks:
      - load-test-network

  # 监控服务
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - load-test-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'

  # Grafana仪表板
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - load-test-network
    depends_on:
      - prometheus

  # 日志收集
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - load-test-network

  # 日志可视化
  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - load-test-network
    depends_on:
      - elasticsearch

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:

networks:
  load-test-network:
    driver: bridge
