# Apache Cache Configuration
# Generated by Web3search Cache Optimizer

<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType text/html "access plus 1 hours"
  ExpiresByType text/css "access plus 1 days"
  ExpiresByType application/javascript "access plus 1 days"
  ExpiresByType image/jpeg image/png image/gif image/webp "access plus 1 months"
  ExpiresByType application/json "access plus 300 seconds"
  ExpiresByType font/woff font/woff2 "access plus 1 years"
</IfModule>

<IfModule mod_deflate.c>
  SetOutputFilter DEFLATE
  SetEnvIfNoCase Request_URI \
    \.(?:gif|jpe?g|png)$ no-gzip dont-vary
  SetEnvIfNoCase Request_URI \
    \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary
</IfModule>
