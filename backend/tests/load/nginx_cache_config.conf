# Nginx Cache Configuration
# Generated by Web3search Cache Optimizer

# Basic cache settings
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=1g inactive=60m;
proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:100m max_size=10g inactive=7d;

location ~ \.html$ {
    proxy_cache_valid 200 3600;
    proxy_cache_background_update on;
    expires 3600s;
    add_header Cache-Control "public, must-revalidate, stale-while-revalidate=300, stale-if-error=86400, max-age=3600";
    etag on;
    gzip on;
}

location ~ \.css$ {
    proxy_cache_valid 200 86400;
    expires 86400s;
    add_header Cache-Control "public, stale-while-revalidate=3600, stale-if-error=604800, max-age=86400";
    etag on;
    gzip on;
}

location ~ \.(js|mjs)$ {
    proxy_cache_valid 200 86400;
    expires 86400s;
    add_header Cache-Control "public, stale-while-revalidate=3600, stale-if-error=604800, max-age=86400";
    etag on;
    gzip on;
}

location ~ \.(jpg|jpeg|png|gif|webp|svg)$ {
    proxy_cache_valid 200 2592000;
    expires 2592000s;
    add_header Cache-Control "public, stale-while-revalidate=86400, stale-if-error=31536000, max-age=2592000";
    etag on;
}

location ~ ^/api/ {
    proxy_cache_valid 200 300;
    proxy_cache_background_update on;
    expires 300s;
    add_header Cache-Control "private, must-revalidate, stale-while-revalidate=60, stale-if-error=86400, max-age=300";
    etag on;
    gzip on;
}

location ~ \.(woff|woff2|ttf|otf|eot)$ {
    proxy_cache_valid 200 31536000;
    expires 31536000s;
    add_header Cache-Control "public, stale-while-revalidate=2592000, stale-if-error=31536000, max-age=31536000";
    etag on;
}


# Compression settings
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
# Brotli compression (if available)
brotli on;
brotli_comp_level 4;
brotli_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
