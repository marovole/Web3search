# TL;DR生成Prompt模板
name: "TL;DR Generator"
version: "1.0.0"
description: "生成加密货币项目的TL;DR摘要，包含核心判断和置信度"

# 模型配置
model: "qwen/qwen-2.5-72b-instruct:free"
temperature: 0.7
max_tokens: 500

# 系统Prompt
system: |
  你是一位专业的加密货币分析师，擅长快速总结项目的核心投资价值。
  你的任务是生成简洁、准确的TL;DR摘要，帮助投资者快速了解项目。

  输出要求：
  1. 核心判断必须是Bull（看涨）、Neutral（中性）或Bear（看跌）之一
  2. 置信度范围：0-100，数值越高表示确信度越高
  3. 一句话总结必须在50-150字之间
  4. 基于客观数据，避免主观臆测

# 用户Prompt模板（支持变量替换）
user_template: |
  请为以下加密货币项目生成TL;DR摘要：

  **项目名称**: {project_name}
  **当前价格**: ${price}
  **市值**: ${market_cap}
  **24小时交易量**: ${volume_24h}
  **24小时价格变化**: {price_change_24h}%
  **7天价格变化**: {price_change_7d}%
  **30天价格变化**: {price_change_30d}%

  **链上数据**:
  - 活跃地址数: {active_addresses}
  - 日交易笔数: {daily_transactions}

  **社媒情绪**:
  - Twitter情绪: {twitter_sentiment}
  - Reddit情绪: {reddit_sentiment}

  请生成JSON格式的TL;DR，包含以下字段：
  {{
    "core_thesis": "Bull/Neutral/Bear",
    "confidence": 85,
    "one_liner": "一句话总结项目的核心价值和风险",
    "key_metrics": {{
      "price": {price},
      "market_cap": "{market_cap}",
      "volume_24h": "{volume_24h}"
    }}
  }}

# Few-shot示例
few_shot_examples:
  - input: |
      项目名称: Ethereum
      当前价格: $3500
      市值: $420B
      24小时交易量: $15B
      24小时价格变化: 2.5%
      7天价格变化: 8.3%
      活跃地址数: 500K
      Twitter情绪: 积极 (75%)
    output: |
      {{
        "core_thesis": "Bull",
        "confidence": 88,
        "one_liner": "以太坊作为智能合约平台龙头，生态持续扩张，Layer2发展强劲，短期技术面突破关键阻力位，链上活跃度维持高位，社区情绪积极。",
        "key_metrics": {{
          "price": 3500,
          "market_cap": "420B",
          "volume_24h": "15B"
        }}
      }}

  - input: |
      项目名称: Shiba Inu
      当前价格: $0.00001
      市值: $5B
      24小时交易量: $200M
      24小时价格变化: -5.2%
      7天价格变化: -12.8%
      活跃地址数: 50K
      Twitter情绪: 中性 (55%)
    output: |
      {{
        "core_thesis": "Neutral",
        "confidence": 65,
        "one_liner": "Meme币缺乏实际应用场景，价格高度依赖社区炒作，短期技术面走弱，交易量下滑，需观察社区活跃度和市场情绪变化。",
        "key_metrics": {{
          "price": 0.00001,
          "market_cap": "5B",
          "volume_24h": "200M"
        }}
      }}
