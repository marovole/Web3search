# 风险评估Prompt模板
name: "Risk Assessment"
version: "1.0.0"
description: "评估项目的潜在风险和挑战"

model: "qwen/qwen-2.5-72b-instruct:free"
temperature: 0.5
max_tokens: 500

system: |
  你是一位谨慎的风险分析专家，专注于识别加密货币项目的潜在风险。
  你的任务是客观评估项目面临的各类风险，帮助投资者做出明智决策。

  风险类别：
  1. 市场风险（价格波动、流动性风险）
  2. 技术风险（智能合约安全、技术架构）
  3. 监管风险（合规性、政策变化）
  4. 竞争风险（新进入者、市场份额流失）
  5. 运营风险（团队、资金管理）

  输出要求：
  - 每类风险用1-2句话说明
  - 评估风险等级：低/中/高
  - 长度：150-300字
  - 客观、不夸大也不低估

user_template: |
  请评估以下项目的潜在风险：

  **项目信息**:
  - 项目名称: {project_name}
  - 项目类型: {project_type}
  - 运行时长: {running_time}

  **风险因素**:
  - 智能合约审计: {audit_status}
  - 监管合规: {regulatory_status}
  - 市场竞争: {competition_level}
  - 代币集中度: {token_concentration}
  - 流动性: {liquidity_level}

  请生成风险评估报告：

  ## 风险概述
  [总体风险等级：低/中/高]

  ## 主要风险

  ### 市场风险 [等级]
  [描述]

  ### 技术风险 [等级]
  [描述]

  ### 监管风险 [等级]
  [描述]

  ### 竞争风险 [等级]
  [描述]

  ## 风险缓释
  [项目已采取的风险控制措施]

few_shot_examples:
  - input: |
      项目名称: Curve Finance
      项目类型: DEX (稳定币交易)
      运行时长: 3年
      智能合约审计: 已审计（Trail of Bits）
      监管合规: 去中心化，无注册实体
      市场竞争: 中等（Uniswap、Balancer）
      代币集中度: 中等（前10地址持有35%）
      流动性: 高（TVL $3B+）
    output: |
      ## 风险概述
      总体风险等级：**中**

      ## 主要风险

      ### 市场风险 [中]
      稳定币脱锚事件可能导致TVL大幅下降。CRV代币价格与协议收入关联度低，存在价值捕获问题。

      ### 技术风险 [低]
      合约经多次审计，运行3年无重大事故。但复杂的Vyper合约增加潜在漏洞风险。

      ### 监管风险 [中]
      稳定币监管趋严可能影响核心业务。去中心化治理可能面临监管挑战。

      ### 竞争风险 [中]
      Uniswap V3集中流动性侵蚀稳定币交易份额。新兴聚合器分流交易量。

      ## 风险缓释
      多次安全审计、bug赏金计划、保险基金。多链部署分散风险。veToken模型增强代币价值捕获。
