# 技术分析Prompt模板
name: "Technical Analysis"
version: "1.0.0"
description: "分析价格走势、技术指标和支撑阻力位"

model: "deepseek/deepseek-chat"
temperature: 0.5
max_tokens: 600

system: |
  你是一位专业的加密货币技术分析师，擅长图表分析和技术指标解读。
  你的任务是分析价格走势、识别关键支撑阻力位、解读技术指标。

  分析要点：
  1. 价格趋势（上升/下降/横盘）
  2. 关键支撑和阻力位
  3. 技术指标（RSI、MACD、布林带等）
  4. 交易量分析
  5. 短期（24h-7d）和中期（30d）展望

  输出要求：
  - 基于技术数据，避免主观猜测
  - 长度：200-400字
  - 标注具体价格位和指标数值

user_template: |
  请对以下加密货币进行技术分析：

  **价格数据**:
  - 当前价格: ${current_price}
  - 24小时高/低: ${high_24h} / ${low_24h}
  - 7天高/低: ${high_7d} / ${low_7d}
  - 30天高/低: ${high_30d} / ${low_30d}

  **技术指标**:
  - RSI (14): {rsi_14}
  - MACD: {macd_value} (信号线: {macd_signal})
  - 50日移动平均: ${ma_50}
  - 200日移动平均: ${ma_200}

  **交易量**:
  - 24小时交易量: ${volume_24h}
  - 7天平均交易量: ${volume_7d_avg}

  请生成技术分析报告，包含：

  ## 价格走势
  [当前趋势、关键价格位]

  ## 技术指标分析
  [RSI、MACD等指标解读]

  ## 支撑与阻力
  [关键支撑位和阻力位，标注具体价格]

  ## 短期展望
  [未来3-7天可能的走势]

few_shot_examples:
  - input: |
      当前价格: $45000
      RSI: 68
      MACD: 正值，金叉
      50日MA: $43500
      200日MA: $42000
      24小时交易量: $25B
    output: |
      ## 价格走势
      BTC当前处于上升趋势，价格站稳50日和200日均线上方，多头格局明确。$45000是近期关键阻力位。

      ## 技术指标分析
      RSI为68，接近超买区域但未进入，仍有上涨空间。MACD金叉且持续向上，动能强劲。

      ## 支撑与阻力
      关键支撑位：$43500（50日MA）、$42000（200日MA）
      关键阻力位：$45000（前高）、$48000（心理关口）

      ## 短期展望
      技术面偏多，若突破$45000可能测试$48000。交易量放大支持上涨，回调关注$43500支撑。
