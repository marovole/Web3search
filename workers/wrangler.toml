# Cloudflare Workers Configuration
# https://developers.cloudflare.com/workers/wrangler/configuration/

name = "web3search-worker"
main = "src/index.ts"
compatibility_date = "2025-01-01"
account_id = "b80eef96097fab92f15b574ed5fbb927"

# Workers开发环境
workers_dev = true

# KV命名空间（用于边缘缓存）
[[kv_namespaces]]
binding = "CACHE"
id = "31dbcabb88ca4f6f83585a592965c782"

# 环境变量（非机密）
[vars]
APP_VERSION = "workers-dev"
CORS_ORIGINS = "http://localhost:5173,http://localhost:3000"
SUPABASE_URL = "https://hxxnkbxyjhhorfeodiji.supabase.co"
SUPABASE_HEALTH_TABLE = "projects"

# 机密变量需通过 wrangler secret put 设置：
# wrangler secret put SUPABASE_ANON_KEY
# wrangler secret put SUPABASE_SERVICE_ROLE_KEY (可选)
# wrangler secret put OPENROUTER_API_KEY

# Cron Triggers（定时任务）
[triggers]
crons = [
  "*/5 * * * *",  # 每 5 分钟：健康检查
  "0 * * * *",    # 每小时：KV 缓存清理
]

# 生产环境配置
[env.production]
name = "web3search-api"
# route = "api.web3search.ai/*"  # 自定义域名路由
workers_dev = true  # 启用 workers.dev 子域名访问

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "31dbcabb88ca4f6f83585a592965c782"

[env.production.vars]
APP_VERSION = "workers-2025.01.20"
CORS_ORIGINS = "https://web3search.pages.dev,https://web3search.vercel.app"
SUPABASE_URL = "https://hxxnkbxyjhhorfeodiji.supabase.co"
SUPABASE_HEALTH_TABLE = "projects"
ENVIRONMENT = "production"

# 开发环境配置
[env.development]
name = "web3search-worker-dev"
workers_dev = true

[env.development.vars]
APP_VERSION = "workers-dev"
CORS_ORIGINS = "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
SUPABASE_URL = "https://hxxnkbxyjhhorfeodiji.supabase.co"
SUPABASE_HEALTH_TABLE = "projects"
