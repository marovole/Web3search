<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare Pages Deployment Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        h1 { margin-top: 0; }
        .status { 
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            background: rgba(76, 175, 80, 0.3);
        }
        .info {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
        }
        code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 5px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ Cloudflare Pages 部署测试成功</h1>
        
        <div class="status">
            <strong>状态:</strong> 基础部署正常运行
        </div>
        
        <div class="info">
            <h3>测试信息</h3>
            <p><strong>项目:</strong> Web3 AI Search Engine</p>
            <p><strong>平台:</strong> Cloudflare Pages</p>
            <p><strong>测试时间:</strong> <span id="time"></span></p>
            <p><strong>当前 URL:</strong> <code id="url"></code></p>
        </div>
        
        <div class="info">
            <h3>下一步</h3>
            <p>如果您能看到这个页面，说明 Cloudflare Pages 基础部署正常。</p>
            <p>现在请访问主页: <a href="/" style="color: #ffd700;">https://web3search.pages.dev/</a></p>
        </div>
    </div>
    
    <script>
        document.getElementById('time').textContent = new Date().toLocaleString('zh-CN');
        document.getElementById('url').textContent = window.location.href;
    </script>
</body>
</html>
