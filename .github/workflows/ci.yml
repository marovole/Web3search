name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18, 20]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run TypeScript check
        run: |
          cd frontend
          npm run type-check

      - name: Run unit tests with coverage
        run: |
          cd frontend
          npm run test:coverage

      - name: Check coverage thresholds
        run: |
          cd frontend
          npm run test:coverage-check

      - name: Run E2E tests
        run: |
          cd frontend
          npm run test:e2e
        continue-on-error: true

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: frontend/coverage
          fail_ci_if_error: false
          flags: frontend-node-${{ matrix.node-version }}
          name: frontend-coverage-node-${{ matrix.node-version }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: frontend/coverage/
          retention-days: 30

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-node-${{ matrix.node-version }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            frontend/coverage/
            frontend/test-results/
          retention-days: 7

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build application
        run: |
          cd frontend
          npm run build

      - name: Analyze bundle size
        run: |
          cd frontend
          npm run build:analyze
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: frontend/dist
          retention-days: 7

  # Load Testing Jobs
  load-test-setup:
    name: Setup Load Test Environment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/tests/load/requirements.txt'
          
      - name: Install load testing dependencies
        run: |
          cd backend/tests/load
          pip install -r requirements.txt
          
      - name: Create test directories
        run: |
          cd backend/tests/load
          mkdir -p reports logs data
          
      - name: Prepare test data
        run: |
          cd backend/tests/load
          python prepare_load_test_data.py
          
      - name: Upload test data
        uses: actions/upload-artifact@v4
        with:
          name: load-test-data
          path: backend/tests/load/data/
          retention-days: 1

  load-test-smoke:
    name: Smoke Load Test
    runs-on: ubuntu-latest
    needs: [load-test-setup, build]
    if: github.event_name == 'pull_request'
    
    services:
      mock-api:
        image: python:3.11-slim
        options: >-
          --health-cmd "curl -f http://localhost:8001/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 8001:8001
          
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/tests/load/requirements.txt'
          
      - name: Install dependencies
        run: |
          cd backend/tests/load
          pip install -r requirements.txt
          pip install fastapi uvicorn
          
      - name: Start mock AI service
        run: |
          cd backend/tests/load
          python mock_ai_service.py &
          sleep 10
          
      - name: Run smoke load test
        run: |
          cd backend/tests/load
          locust -f locustfile.py \
            --host=http://localhost:8001 \
            --headless \
            --users 50 \
            --spawn-rate 5 \
            --run-time 60s \
            --html reports/smoke_test_report.html \
            --csv reports/smoke_test_stats
            
      - name: Analyze load test results
        run: |
          cd backend/tests/load
          python performance_benchmark.py
          
      - name: Upload load test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-load-test-report
          path: backend/tests/load/reports/
          retention-days: 7
          
      - name: Check performance thresholds
        run: |
          cd backend/tests/load
          python -c "
          import json
          import sys
          
          try:
              with open('reports/smoke_test_stats_stats.csv', 'r') as f:
                  lines = f.readlines()
                  if len(lines) > 1:
                      data = lines[-1].split(',')
                      p95_response = float(data[6])  # P95 response time
                      error_rate = float(data[2]) / float(data[1])  # Error rate
                      
                      if p95_response > 5000:  # 5 second threshold
                          print(f'❌ P95 response time too high: {p95_response}ms')
                          sys.exit(1)
                      if error_rate > 0.05:  # 5% error rate threshold
                          print(f'❌ Error rate too high: {error_rate*100:.2f}%')
                          sys.exit(1)
                      print(f'✅ Performance thresholds passed: P95={p95_response}ms, Error={error_rate*100:.2f}%')
          except Exception as e:
              print(f'⚠️ Could not analyze performance: {e}')
          "

  load-test-full:
    name: Full Load Test
    runs-on: ubuntu-latest
    needs: [load-test-setup, build]
    if: github.ref == 'refs/heads/main'
    
    services:
      mock-api:
        image: python:3.11-slim
        options: >-
          --health-cmd "curl -f http://localhost:8001/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 8001:8001
          
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/tests/load/requirements.txt'
          
      - name: Install dependencies
        run: |
          cd backend/tests/load
          pip install -r requirements.txt
          pip install fastapi uvicorn
          
      - name: Start mock AI service
        run: |
          cd backend/tests/load
          python mock_ai_service.py &
          sleep 10
          
      - name: Run functional load test
        run: |
          cd backend/tests/load
          locust -f locustfile.py \
            --host=http://localhost:8001 \
            --headless \
            --users 200 \
            --spawn-rate 20 \
            --run-time 120s \
            --html reports/functional_test_report.html \
            --csv reports/functional_test_stats
            
      - name: Run advanced user behavior test
        run: |
          cd backend/tests/load
          locust -f advanced_user_behavior.py \
            --host=http://localhost:8001 \
            --headless \
            --users 500 \
            --spawn-rate 50 \
            --run-time 180s \
            --html reports/advanced_behavior_report.html \
            --csv reports/advanced_behavior_stats
            
      - name: Run stress test
        run: |
          cd backend/tests/load
          locust -f locustfile.py \
            --host=http://localhost:8001 \
            --headless \
            --users 1000 \
            --spawn-rate 100 \
            --run-time 300s \
            --html reports/stress_test_report.html \
            --csv reports/stress_test_stats
            
      - name: Analyze all load test results
        run: |
          cd backend/tests/load
          python performance_benchmark.py
          
      - name: Generate performance report
        run: |
          cd backend/tests/load
          python -c "
          import json
          from datetime import datetime
          
          report = {
            'timestamp': datetime.now().isoformat(),
            'commit': '${{ github.sha }}',
            'branch': '${{ github.ref_name }}',
            'tests_completed': ['functional', 'advanced_behavior', 'stress'],
            'summary': 'All load tests completed successfully'
          }
          
          with open('reports/performance_summary.json', 'w') as f:
              json.dump(report, f, indent=2)
          "
          
      - name: Upload comprehensive load test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-load-test-reports
          path: backend/tests/load/reports/
          retention-days: 30
          
      - name: Comment PR with performance results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            
            try {
              const report = JSON.parse(fs.readFileSync('backend/tests/load/reports/performance_summary.json', 'utf8'));
              
              const comment = `
              ## 🚀 Load Test Results
              
              **Commit:** ${report.commit}
              **Timestamp:** ${report.timestamp}
              
              ✅ **Tests Completed:**
              ${report.tests_completed.map(test => `- ${test}`).join('\n')}
              
              **Summary:** ${report.summary}
              
              📊 [View detailed reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Could not post performance comment:', error);
            }

  # Performance and Quality Gates
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs: [test, build, load-test-smoke]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-report-node-18
          path: frontend/coverage/

      - name: Check test coverage quality gates
        run: |
          cd frontend
          npm run test:coverage-check

      - name: Run accessibility tests
        run: |
          cd frontend
          npm run test:a11y
        continue-on-error: true

      - name: Run performance tests (Lighthouse CI)
        run: |
          cd frontend
          npm run build
          npm run test:lighthouse
        continue-on-error: true

      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-report
          path: frontend/a11y-report/
          retention-days: 7

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: frontend/.lighthouseci/
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: |
          cd frontend
          npm audit --audit-level=high

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'frontend'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, quality-gates, load-test-smoke]
    if: github.ref == 'refs/heads/develop' && needs.load-test-smoke.result == 'success'
    environment: staging
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: frontend/dist

      - name: Deploy to Vercel (Staging)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, security-scan, quality-gates, load-test-full]
    if: github.ref == 'refs/heads/main' && needs.load-test-full.result == 'success'
    environment: production
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: frontend/dist

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Run smoke tests
        run: |
          # Add smoke test commands here
          echo "Running smoke tests against production..."
        continue-on-error: true

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production, load-test-full]
    if: always()
    steps:
      - name: Notify Slack on success
        if: ${{ needs.deploy-production.result == 'success' || needs.deploy-staging.result == 'success' }}
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: '✅ Deployment successful!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: ${{ needs.deploy-production.result == 'failure' || needs.deploy-staging.result == 'failure' }}
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: '❌ Deployment failed!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
