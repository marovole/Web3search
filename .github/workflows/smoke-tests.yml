name: Smoke Tests

# 在部署完成后自动运行烟雾测试
on:
  # 手动触发
  workflow_dispatch:
    inputs:
      frontend_url:
        description: '前端 URL'
        required: false
        default: 'https://web3search.pages.dev'
      backend_url:
        description: '后端 URL'
        required: false
        default: 'https://web3search-api.marovole.workers.dev'

  # 在部署 workflow 完成后自动触发
  workflow_run:
    workflows: ["Deploy to Production"]
    types:
      - completed

  # 定时运行 (每小时)
  schedule:
    - cron: '0 * * * *'

jobs:
  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest

    # 只在部署成功后运行
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run smoke tests
        env:
          FRONTEND_URL: ${{ github.event.inputs.frontend_url || 'https://web3search.pages.dev' }}
          BACKEND_URL: ${{ github.event.inputs.backend_url || 'https://web3search-api.marovole.workers.dev' }}
        run: |
          node scripts/smoke-test.js

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue_body = `
            ## 🚨 Smoke Tests Failed

            **Workflow:** ${{ github.workflow }}
            **Run:** ${{ github.run_number }}
            **Frontend URL:** ${{ env.FRONTEND_URL }}
            **Backend URL:** ${{ env.BACKEND_URL }}

            Please check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

            ### Next Steps
            1. Check if the deployment actually succeeded
            2. Verify backend API is running
            3. Check CORS configuration
            4. Review application logs
            `;

            // 创建一个 issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Smoke Tests Failed - ' + new Date().toISOString().split('T')[0],
              body: issue_body,
              labels: ['bug', 'smoke-test-failure', 'production']
            });

      - name: Comment on PR (if applicable)
        if: failure() && github.event.pull_request
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🚨 Smoke tests failed after deployment. Please check the deployment and fix any issues before merging.'
            });
