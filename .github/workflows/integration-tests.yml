name: Integration Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  frontend-integration-tests:
    name: Frontend API Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run integration tests
        env:
          VITE_API_BASE_URL: https://web3search-api.marovole.workers.dev
          VITE_ENVIRONMENT: test
        run: |
          cd frontend
          npm run test:integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results/

  e2e-tests:
    name: End-to-End API Tests
    runs-on: ubuntu-latest
    needs: [frontend-integration-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          VITE_API_BASE_URL: https://web3search-api.marovole.workers.dev
        run: |
          cd frontend
          npm run test:e2e

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: frontend/test-results/

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [frontend-integration-tests, e2e-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "Frontend Integration Tests: ${{ needs.frontend-integration-tests.result }}"
          echo "E2E Tests: ${{ needs.e2e-tests.result }}"

          if [[ "${{ needs.frontend-integration-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.e2e-tests.result }}" == "failure" ]]; then
            echo "❌ Some integration tests failed"
            exit 1
          else
            echo "✅ All integration tests passed"
          fi
