# Cloudflare Workers Configuration
# Documentation: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "web3search-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Account ID (replace with your Cloudflare account ID)
# Get it from: https://dash.cloudflare.com/ → Workers & Pages → Overview
# SECURITY: Never commit real account ID to version control
# Use environment variable: wrangler secret put CLOUDFLARE_ACCOUNT_ID
# account_id = "your-account-id-here"

# ============================================
# Development Environment
# ============================================
[env.development]
name = "web3search-api-dev"
vars = { ENVIRONMENT = "development" }

[[env.development.kv_namespaces]]
binding = "CACHE"
id = "edb34a61693d46ce8d0894534f0ce9b3"

[[env.development.kv_namespaces]]
binding = "MULTI_AGENT_TASKS"
id = "499541d68e6e4e55be911b54960d46eb"

# ============================================
# Production Environment
# ============================================
[env.production]
name = "web3search-api"
workers_dev = true
route = "api.lulaai.xyz/*"  # Custom domain configured
vars = { ENVIRONMENT = "production" }

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "edb34a61693d46ce8d0894534f0ce9b3"

# ============================================
# KV Namespaces (缓存)
# ============================================
# Created with: wrangler kv namespace create CACHE

[[kv_namespaces]]
binding = "CACHE"
id = "edb34a61693d46ce8d0894534f0ce9b3"

# ============================================
# Environment Variables (Secrets)
# ============================================
# Set secrets using: wrangler secret put VARIABLE_NAME
#
# Required secrets:
# - SUPABASE_URL                  : Supabase project URL
# - SUPABASE_ANON_KEY            : Supabase anonymous key
# - SUPABASE_SERVICE_ROLE_KEY    : (optional) For admin operations
# - OPENROUTER_API_KEY           : OpenRouter LLM API key
#
# Search Provider API Keys (at least one required):
# - BRAVE_SEARCH_API_KEY         : Brave Search API (primary provider)
# - TAVILY_API_KEY               : Tavily Search API (failover)
# - SERPER_API_KEY               : Serper (Google) Search API (failover)
#
# Provider failover priority: Brave → Tavily → Serper
# For API key acquisition, see: docs/SEARCH_PROVIDERS.md

# ============================================
# Observability
# ============================================
[observability]
enabled = true

# ============================================
# Build Configuration
# ============================================
[build]
command = ""

# ============================================
# Scheduled Events (Cron Triggers)
# ============================================
[triggers]
crons = []

# ============================================
# Limits
# ============================================
# Free tier: 100,000 requests/day, 10ms CPU time
# limits = { cpu_ms = 10 }
