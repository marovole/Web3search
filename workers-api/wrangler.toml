# Cloudflare Workers Configuration
# Documentation: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "web3search-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Account ID (replace with your Cloudflare account ID)
# Get it from: https://dash.cloudflare.com/ → Workers & Pages → Overview
# account_id = "YOUR_ACCOUNT_ID"

# ============================================
# Development Environment
# ============================================
[env.development]
name = "web3search-api-dev"
vars = { ENVIRONMENT = "development" }

# ============================================
# Production Environment
# ============================================
[env.production]
name = "web3search-api"
workers_dev = false
# route = "api.web3search.com/*"  # Uncomment when custom domain is ready
vars = { ENVIRONMENT = "production" }

# ============================================
# KV Namespaces (缓存)
# ============================================
# Create KV namespace: wrangler kv:namespace create CACHE
# Then add the ID here:

# Uncomment after creating KV namespace
# [[kv_namespaces]]
# binding = "CACHE"
# id = "YOUR_KV_NAMESPACE_ID"
# preview_id = "preview_kv_id"

# ============================================
# Environment Variables (Secrets)
# ============================================
# Set secrets using: wrangler secret put VARIABLE_NAME
# Required secrets:
# - SUPABASE_URL
# - SUPABASE_ANON_KEY
# - SUPABASE_SERVICE_ROLE_KEY (optional, for admin operations)
# - OPENROUTER_API_KEY

# ============================================
# Observability
# ============================================
[observability]
enabled = true

# ============================================
# Build Configuration
# ============================================
[build]
command = ""

# ============================================
# Limits
# ============================================
# Free tier: 100,000 requests/day, 10ms CPU time
# limits = { cpu_ms = 10 }
