# Cloudflare Workers Configuration
# Documentation: https://developers.cloudflare.com/workers/wrangler/configuration/

name = "web3search-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Account ID (replace with your Cloudflare account ID)
# Get it from: https://dash.cloudflare.com/ → Workers & Pages → Overview
account_id = "b80eef96097fab92f15b574ed5fbb927"

# ============================================
# Development Environment
# ============================================
[env.development]
name = "web3search-api-dev"
vars = { ENVIRONMENT = "development" }

# ============================================
# Production Environment
# ============================================
[env.production]
name = "web3search-api"
workers_dev = true
# route = "api.web3search.com/*"  # Uncomment when custom domain is ready
vars = { ENVIRONMENT = "production" }

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "edb34a61693d46ce8d0894534f0ce9b3"

# ============================================
# KV Namespaces (缓存)
# ============================================
# Created with: wrangler kv namespace create CACHE

[[kv_namespaces]]
binding = "CACHE"
id = "edb34a61693d46ce8d0894534f0ce9b3"

# ============================================
# Environment Variables (Secrets)
# ============================================
# Set secrets using: wrangler secret put VARIABLE_NAME
# Required secrets:
# - SUPABASE_URL
# - SUPABASE_ANON_KEY
# - SUPABASE_SERVICE_ROLE_KEY (optional, for admin operations)
# - OPENROUTER_API_KEY

# ============================================
# Observability
# ============================================
[observability]
enabled = true

# ============================================
# Build Configuration
# ============================================
[build]
command = ""

# ============================================
# Limits
# ============================================
# Free tier: 100,000 requests/day, 10ms CPU time
# limits = { cpu_ms = 10 }
