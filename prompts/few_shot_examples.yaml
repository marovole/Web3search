# ================================
# 技术分析示例（任务 7.1）
# ================================

technical_analysis_examples:
  # 示例 1: 移动平均线（MA）分析
  - category: "moving_average"
    scenario: "用户询问价格趋势和均线支撑"
    user_query: "BTC 的价格走势如何？现在是买入时机吗？"
    assistant_response: |
      基于最新数据分析 BTC 的价格走势：

      **短期趋势（7日）**
      - 当前价格：$34,520
      - 7日均价：$33,800
      - 价格位于7日均线上方 2.1%，显示短期多头趋势

      **中期趋势（30日）**
      - 30日均价：$32,450
      - 价格位于30日均线上方 6.4%
      - 均线呈上升斜率，中期趋势向好

      **技术信号**
      - 7日均线在30日均线上方（金叉状态）
      - 价格连续5天收于7日均线上方
      - 建议：短期趋势向上，但注意 $35,000 阻力位

      **风险提示**：加密货币市场波动剧烈，技术指标仅供参考，不构成投资建议。

      数据来源：CoinGecko（更新于 2分钟前）

  # 示例 2: 相对强弱指标（RSI）分析
  - category: "rsi"
    scenario: "用户询问超买超卖情况"
    user_query: "ETH 现在是超买还是超卖状态？"
    assistant_response: |
      ETH 的 RSI 指标分析：

      **当前 RSI 读数**
      - 14日 RSI：**68.5**
      - 状态：接近超买区域（70以上为超买）
      - 趋势：过去7天从 52 上升至 68.5

      **历史对比**
      - 30日 RSI 平均值：58.3
      - 当前读数高于平均值 17.5%
      - 过去6个月 RSI 超过 70 的次数：3次

      **技术解读**
      - RSI 68.5 表示近期买盘强劲，但尚未过热
      - 接近超买区域，短期回调压力增加
      - 建议：谨慎追高，等待回调机会

      **配合其他指标**
      - 成交量：较30日均值增长 45%（强势确认）
      - 价格：24小时涨幅 +5.2%

      数据来源：TradingView（更新于 5分钟前）

  # 示例 3: MACD 动量分析
  - category: "macd"
    scenario: "用户询问动量变化和买卖时机"
    user_query: "SOL 的动量指标显示什么信号？"
    assistant_response: |
      SOL 的 MACD 动量分析：

      **MACD 指标读数**
      - MACD 线：+1.85
      - 信号线：+1.42
      - 柱状图：+0.43（正值且扩大）

      **技术信号**
      - 状态：MACD 线在信号线上方（**金叉**）
      - 金叉时间：3天前
      - 柱状图连续扩大，动量增强

      **趋势分析**
      - 短期动量：**强势上涨**
      - MACD 从负值区域转正，确认趋势反转
      - 柱状图面积扩大 +28%，买盘加速

      **历史参考**
      - 过去3个月内出现5次金叉
      - 平均持续上涨周期：8-12天
      - 平均涨幅：+15-25%

      **操作建议**
      - 金叉初期，动量指标支持继续持有
      - 关注 MACD 柱状图缩小信号（动量减弱）
      - 设置止损位于近期低点 $95

      数据来源：Coinbase Pro（更新于 1分钟前）

# ================================
# 情绪分析示例（任务 7.2）
# ================================

sentiment_analysis_examples:
  # 示例 1: 正面情绪分析
  - category: "positive_sentiment"
    scenario: "社区情绪积极，新闻利好"
    user_query: "最近大家对 AVAX 的看法怎么样？"
    assistant_response: |
      AVAX 近期市场情绪分析：

      **情绪得分：+0.72**（偏乐观）

      **社交媒体情绪**
      - Twitter 提及量：24小时内 15,240 次（+68% vs 上周）
      - 正面情绪占比：**73%**
      - 负面情绪占比：12%
      - 中性：15%

      **主要驱动因素**
      1. **技术升级公告**：Avalanche 宣布新的子网扩展方案
      2. **合作伙伴**：与大型金融机构达成合作
      3. **链上活跃度**：日交易量增长 +92%

      **社区讨论热点**
      - Reddit r/Avax：热帖讨论生态扩展（+580 upvotes）
      - Discord 活跃用户：较上月增长 34%
      - Telegram 群组：讨论热度 +45%

      **新闻覆盖**
      - 主流媒体报道：8篇正面报道
      - 分析师评级：3位分析师给予"买入"评级

      **情绪趋势**
      - 7日前：+0.45（中性偏正）
      - 当前：+0.72（明显乐观）
      - 趋势：**持续改善**

      **风险提示**：情绪高涨时需注意回调风险，避免盲目追高。

      数据来源：LunarCrush、Twitter API、Reddit（更新于 15分钟前）

  # 示例 2: 负面情绪分析
  - category: "negative_sentiment"
    scenario: "市场恐慌，负面新闻影响"
    user_query: "为什么 LUNA 今天跌这么多？大家在担心什么？"
    assistant_response: |
      LUNA 当前市场情绪分析：

      **情绪得分：-0.65**（偏悲观）

      **价格表现**
      - 24小时跌幅：**-18.5%**
      - 7日跌幅：-32.7%
      - 当前价格：$45.20

      **负面情绪来源**

      **1. 安全漏洞担忧**
      - 某安全机构发布警告：智能合约存在潜在风险
      - 社区要求团队公开审计报告
      - Twitter 讨论量激增 +240%，负面情绪占 68%

      **2. 大额转账引发恐慌**
      - 链上监测：某巨鲸地址转出 500万枚 LUNA 到交易所
      - 市场担忧抛售压力
      - Reddit 热帖："鲸鱼在逃跑吗？"（+1200 upvotes）

      **3. 竞品压力**
      - 竞争对手发布新功能，抢占市场份额
      - 分析师下调评级（由"持有"降至"减持"）

      **社区反应**
      - Discord：用户询问项目方何时回应（消息量 +310%）
      - Telegram：出现 FUD（恐惧、不确定、怀疑）情绪扩散
      - Twitter：负面评论占比从 20% 上升至 68%

      **官方回应**
      - 项目方尚未发布正式声明
      - 社区等待进一步澄清

      **建议**
      - 当前情绪极度悲观，等待官方回应和更多信息
      - 避免恐慌性抛售，保持理性判断
      - 关注项目方公告和链上数据变化

      数据来源：CryptoQuant、Etherscan、Twitter API（更新于 10分钟前）

# ================================
# 风险评估示例（任务 7.3）
# ================================

risk_assessment_examples:
  # 示例 1: 高风险项目
  - category: "high_risk"
    scenario: "新项目、团队匿名、流动性低"
    user_query: "SHIB2.0 这个新币值得投资吗？"
    assistant_response: |
      SHIB2.0 风险评估报告：

      **综合风险等级：⚠️ 极高风险**

      **关键风险因素**

      **1. 团队风险（极高）**
      - 团队成员：**完全匿名**
      - 无法验证技术背景和项目经验
      - 官网信息极其有限
      - ⚠️ 警告：匿名团队容易"跑路"

      **2. 技术风险（高）**
      - 代码未开源
      - 无第三方安全审计
      - 智能合约未验证
      - ⚠️ 存在合约漏洞或后门风险

      **3. 市场风险（极高）**
      - 上线时间：仅 7 天
      - 流动性：$120,000（**极低**）
      - 持币地址：仅 1,200 个
      - Top 10 持币占比：**87%**（高度集中）
      - ⚠️ 鲸鱼可随时砸盘

      **4. 项目风险（极高）**
      - 白皮书：内容空洞，缺乏技术细节
      - 实用性：**无实际应用场景**
      - 路线图：模糊不清
      - ⚠️ 典型的"蹭热度"代币

      **5. 监管风险（中）**
      - 项目主体不明，合规性存疑
      - 可能被交易所下架

      **危险信号 🚨**
      - 社交媒体充斥"一夜暴富"承诺
      - 价格在 48 小时内暴涨 800%（不可持续）
      - 项目方无任何背书或合作伙伴

      **结论**
      - 风险极高，强烈不推荐参与
      - 典型的高风险投机型项目
      - 极大概率为短期炒作或潜在骗局

      **投资者保护建议**
      - ❌ 避免投入超过可承受损失的资金
      - ❌ 不要相信"保证收益"承诺
      - ✅ 优先选择知名、经过验证的项目

      数据来源：DexScreener、TokenSniffer（更新于 5分钟前）

  # 示例 2: 中风险项目
  - category: "medium_risk"
    scenario: "成熟项目但面临竞争压力"
    user_query: "UNI 代币现在的风险如何？"
    assistant_response: |
      UNI (Uniswap) 风险评估报告：

      **综合风险等级：⚠️ 中等风险**

      **风险分析**

      **1. 技术风险（低）**
      - ✅ 代码开源，多次安全审计
      - ✅ 智能合约经过实战验证（TVL $4.2B）
      - ✅ 技术团队实力强
      - ⚠️ 仍存在智能合约 bug 可能性

      **2. 市场风险（中）**
      - 交易量：24小时 $1.2B
      - 流动性：充足（深度排名前5）
      - 价格波动：30日波动率 35%（中等）
      - ⚠️ 受整体市场情绪影响较大

      **3. 竞争风险（中高）**
      - 竞争对手：SushiSwap, PancakeSwap, Curve 等
      - 市场份额：从 70% 下降至 48%（过去12个月）
      - ⚠️ 新 DEX 不断涌现，竞争加剧
      - 优势：品牌知名度高，用户基数大

      **4. 监管风险（中）**
      - DeFi 项目面临全球监管不确定性
      - 美国 SEC 对 DeFi 监管态度未明
      - ⚠️ 政策变化可能影响运营

      **5. 治理风险（低-中）**
      - DAO 治理：社区参与度 12%（偏低）
      - 提案执行：部分提案争议较大
      - ⚠️ 治理效率有待提高

      **优势因素**
      - 行业领先地位和品牌效应
      - 持续技术创新（V3 升级）
      - 强大的社区支持
      - 与主流协议深度集成

      **风险缓解措施**
      - 项目方持续迭代产品（V4 规划中）
      - 积极布局多链生态
      - 加强合规性建设

      **投资建议**
      - 风险等级：中等，适合风险承受能力中等的投资者
      - 建议仓位：不超过总资产的 15-20%
      - 持有策略：长期持有，关注竞争格局变化
      - 止损位：建议设置在 -25% 至 -30%

      数据来源：Uniswap Analytics、DefiLlama（更新于 2分钟前）

  # 示例 3: 低风险项目
  - category: "low_risk"
    scenario: "蓝筹项目、基础稳固"
    user_query: "BTC 作为长期投资风险大吗？"
    assistant_response: |
      BTC (Bitcoin) 风险评估报告：

      **综合风险等级：✅ 低-中等风险**

      **风险分析**

      **1. 技术风险（极低）**
      - ✅ 技术成熟，运行 14+ 年无重大事故
      - ✅ 全网算力：400+ EH/s（安全性极高）
      - ✅ 代码经过无数次审计和实战验证
      - ✅ 网络去中心化程度高

      **2. 市场风险（中）**
      - 市值：$672B（全球第一）
      - 流动性：极强（日交易量 $30B+）
      - 价格波动：年化波动率 60-80%
      - ⚠️ 短期波动较大，但长期趋势向上

      **3. 监管风险（低-中）**
      - ✅ 多国承认 BTC 合法性
      - ✅ 机构采用率提升（贝莱德 ETF 申请中）
      - ⚠️ 部分国家仍存在监管不确定性
      - 趋势：全球监管逐步明朗化

      **4. 技术替代风险（低）**
      - BTC 作为"数字黄金"地位稳固
      - 虽有新公链竞争，但 BTC 的价值存储功能不可替代
      - ✅ 网络效应和共识强大

      **5. 系统性风险（中）**
      - 受宏观经济影响（美联储政策、通胀等）
      - 与传统金融市场相关性增强
      - ⚠️ 经济衰退期可能面临抛售压力

      **优势因素**
      - 最高的市场认可度和共识
      - 机构投资者持续增持
      - 稀缺性（总量 2100 万枚）
      - 通胀对冲属性
      - 全球支付网络逐步完善

      **历史表现**
      - 长期投资回报率：+8900%（过去10年）
      - 经历多次牛熊周期，每次都创新高
      - 最大回撤：-80%（但历史上总能恢复）

      **适合人群**
      - ✅ 长期投资者（持有 3-5 年+）
      - ✅ 风险承受能力中等及以上
      - ✅ 相信区块链技术和去中心化理念

      **投资建议**
      - 风险等级：低-中等（加密货币中风险最低）
      - 建议仓位：可作为投资组合的核心资产（20-40%）
      - 持有策略：定投（DCA）+ 长期持有
      - 配置方式：分批买入，降低波动影响

      **风险提示**
      - 短期价格波动大，需承受 30-50% 回撤
      - 不建议使用杠杆或全仓操作
      - 注意私钥安全，选择可靠钱包或交易所

      数据来源：CoinGecko、Glassnode（更新于 1分钟前）

# ================================
# 代币经济学示例（任务 7.4）
# ================================

tokenomics_examples:
  # 示例 1: 通缩型代币
  - category: "deflationary"
    scenario: "代币有销毁机制，总量递减"
    user_query: "BNB 的代币经济模型是怎样的？"
    assistant_response: |
      BNB (Binance Coin) 代币经济学分析：

      **代币模型类型：通缩型**

      **基本信息**
      - 初始总量：200,000,000 BNB
      - 当前流通量：**153,856,150 BNB**
      - 已销毁：46,143,850 BNB（23.07%）
      - 最终目标总量：100,000,000 BNB（销毁 50%）

      **销毁机制（通缩驱动）**

      **1. 季度销毁（主要机制）**
      - 频率：每季度一次
      - 销毁量：基于 Binance 交易所利润
      - 最近一次：销毁 2,139,182 BNB（价值 $529M）
      - 目标：直到剩余 1 亿枚

      **2. 实时销毁（BNB Chain）**
      - Gas 费销毁：每笔链上交易销毁少量 BNB
      - 日销毁量：~1,500 BNB
      - 机制：类似 EIP-1559

      **3. 先锋销毁计划（Pioneer Burn Program）**
      - 基于链上活跃度的额外销毁
      - 销毁量与区块高度、Gas 使用量挂钩

      **通缩效应分析**

      **供应减少趋势**
      - 年销毁率：~3-5%
      - 预计 5-7 年达到 1 亿枚目标
      - 供应曲线：持续下降

      **价格支撑逻辑**
      - 供应减少 + 需求稳定/增长 = 价格上行压力
      - 历史数据：每次大额销毁后价格平均上涨 8-15%

      **需求驱动因素**

      **1. 交易所使用场景**
      - 交易手续费折扣（持有 BNB 享 25% 折扣）
      - Launchpad 参与权（新币发行）
      - VIP 等级提升

      **2. BNB Chain 生态**
      - Gas 费支付（日均 300 万笔交易）
      - DeFi 协议质押（TVL $3.2B）
      - NFT 交易手续费

      **3. 支付场景**
      - Binance Pay 支持商家支付
      - 旅游预订、礼品卡购买等

      **代币经济学评分**

      **供应侧（9/10）**
      - ✅ 明确的通缩机制
      - ✅ 透明的销毁记录
      - ✅ 供应量持续下降

      **需求侧（8/10）**
      - ✅ 多样化使用场景
      - ✅ 强大的交易所和公链生态
      - ⚠️ 高度依赖 Binance 生态

      **价值捕获（8.5/10）**
      - ✅ 销毁机制直接减少供应
      - ✅ 实用性驱动长期需求
      - ✅ 生态扩展带来新用例

      **风险因素**
      - 高度中心化（依赖 Binance）
      - 监管风险（交易所监管）
      - 竞争压力（其他交易平台币）

      **投资逻辑**
      - 通缩模型 + 强生态 = 长期价值支撑
      - 适合中长期持有（1-3年+）
      - 关注每季度销毁公告和生态发展

      数据来源：BscScan、Binance 官方公告（更新于 10分钟前）

  # 示例 2: 通胀型代币
  - category: "inflationary"
    scenario: "代币持续增发，有质押收益"
    user_query: "ETH 转 PoS 后的代币经济模型怎么样？"
    assistant_response: |
      ETH (Ethereum) 代币经济学分析（PoS 时代）

      **代币模型类型：低通胀型（接近零通胀）**

      **基本信息**
      - 当前总供应量：**120,523,456 ETH**
      - 质押量：31,245,890 ETH（25.9% 质押率）
      - 销毁机制：EIP-1559（2021年8月启动）
      - PoS 上线时间：2022年9月（The Merge）

      **供应动态（增发 vs 销毁）**

      **1. 增发（通胀来源）**
      - PoS 质押奖励：年增发率 **~0.5-0.8%**
      - 质押者年化收益：4-5% APR
      - 日增发量：~1,700 ETH/天

      **2. 销毁（通缩来源）**
      - EIP-1559 机制：每笔交易销毁 Base Fee
      - 日销毁量：~2,500 ETH/天（链上活跃时）
      - 累计销毁：4,125,678 ETH（自 EIP-1559 启动）

      **净供应变化**
      - 增发：+1,700 ETH/天
      - 销毁：-2,500 ETH/天
      - **净通缩：-800 ETH/天（-0.24% 年化）**

      **关键特征**

      **1. 动态平衡**
      - 链上活跃度高 → 销毁多 → 通缩
      - 链上活跃度低 → 销毁少 → 轻微通胀
      - 近 6 个月：净通缩状态

      **2. 质押激励**
      - 质押 ETH → 获得增发奖励
      - 锁定供应 → 减少流通量 → 间接支撑价格

      **3. 可持续性**
      - PoW 时代：年通胀率 ~4.5%（高通胀）
      - PoS 时代：接近零通胀或轻微通缩（**改善 90%**）

      **需求驱动因素**

      **1. Gas 费需求**
      - 每笔交易必须支付 ETH
      - DeFi、NFT、L2 等生态消耗 Gas
      - 日均 Gas 消耗：$15-50M

      **2. DeFi 质押**
      - Lido、Rocket Pool 等流动性质押协议
      - 锁定 ETH 获取收益
      - 减少市场流通

      **3. 价值存储**
      - "超声波货币"叙事（Ultrasound Money）
      - 通缩资产 + 生态价值 = 长期增值

      **代币经济学评分**

      **供应侧（9.5/10）**
      - ✅ 成功转为低通胀/通缩模型
      - ✅ 供需平衡机制设计优秀
      - ✅ 质押锁定大量供应

      **需求侧（10/10）**
      - ✅ 最强大的区块链生态
      - ✅ DeFi、NFT、L2 等多场景需求
      - ✅ 机构采用率高

      **价值捕获（9/10）**
      - ✅ Gas 销毁直接减少供应
      - ✅ 质押收益吸引长期持有
      - ✅ 生态扩展持续创造需求

      **与 PoW 时代对比**
      | 指标 | PoW 时代 | PoS 时代 |
      |------|---------|---------|
      | 年增发率 | ~4.5% | ~0.5% |
      | 能源消耗 | 高 | 低 99.95% |
      | 供应趋势 | 持续通胀 | 接近零通胀/通缩 |
      | 质押收益 | 无 | 4-5% APR |

      **投资逻辑**
      - PoS 转型成功改善代币经济学
      - 通缩预期 + 生态价值 = 长期看涨
      - 适合长期持有和质押获取被动收益

      **风险提示**
      - 短期仍受宏观市场影响
      - 质押有锁定期（流动性风险）
      - 技术风险（PoS 机制尚需长期验证）

      数据来源：Etherscan、ultrasound.money（更新于 3分钟前）

