# ================================
# 深度研究报告模板
# 六维度分析提示词
# ================================

# TL;DR 摘要生成
tldr_prompt: |
  基于以下数据，为用户查询生成一个简洁的TL;DR摘要（2-3句话）：

  用户查询: {query}

  市场数据:
  {market_data}

  项目信息:
  {project_info}

  社交数据:
  {social_data}

  要求：
  - 突出最关键的发现（价格、市值、热度等）
  - 使用简洁专业的语言
  - 包含1-2个核心数据点
  - 不要展开细节，只给出高层概览

  示例格式：
  "{项目名称}是一个{类型}项目，当前价格${价格}，市值${市值}。过去24小时{涨跌情况}，社区讨论热度{热度描述}。"

# 维度1：项目概览
overview_prompt: |
  ## 任务：生成项目概览章节

  用户查询: {query}

  项目基本信息:
  {project_info}

  市场数据:
  {market_data}

  要求：
  - 简要介绍项目的定位和核心功能
  - 列出关键指标（市值、价格、排名等）
  - 说明项目所属类别和主要应用场景
  - 使用Markdown格式，包含小标题

  输出格式：
  ```markdown
  ## 项目概览

  ### 基本信息
  - **项目名称**: ...
  - **代币符号**: ...
  - **所属类别**: ...
  - **主要区块链**: ...

  ### 核心功能
  （1-2段描述项目的主要功能和价值主张）

  ### 关键指标
  - **当前价格**: $...
  - **市值**: $... (排名第...)
  - **24h交易量**: $...
  - **流通供应量**: ...
  ```

# 维度2：技术分析
technical_analysis_prompt: |
  ## 任务：生成技术分析章节

  用户查询: {query}

  项目信息:
  {project_info}

  链上数据:
  {onchain_data}

  合约验证状态:
  {contract_verified}

  要求：
  - 评估项目的技术架构和创新性
  - 分析智能合约的安全性
  - 评估代码质量和开发活跃度
  - 识别技术优势和潜在问题

  输出格式：
  ```markdown
  ## 技术分析

  ### 技术架构
  （描述项目的技术实现和架构设计）

  ### 智能合约
  - **合约地址**: ...
  - **验证状态**: ...
  - **安全性评估**: ...

  ### 链上活跃度
  - **24h交易数**: ...
  - **活跃地址**: ...
  - **持有者数量**: ...

  ### 技术评价
  **优势**:
  - ...

  **风险点**:
  - ...
  ```

# 维度3：市场表现分析
market_analysis_prompt: |
  ## 任务：生成市场表现分析章节

  用户查询: {query}

  市场数据:
  {market_data}

  历史数据:
  {historical_data}

  要求：
  - 分析价格走势和市值变化
  - 评估交易量和流动性
  - 对比历史高点和低点
  - 识别价格驱动因素

  输出格式：
  ```markdown
  ## 市场表现分析

  ### 价格走势
  - **当前价格**: ${current_price}
  - **24h变化**: {change_24h}%
  - **7日变化**: {change_7d}%
  - **30日变化**: {change_30d}%

  ### 历史表现
  - **历史最高**: ${ath} ({ath_date})
  - **距离ATH**: {ath_distance}%
  - **历史最低**: ${atl} ({atl_date})

  ### 市值与流动性
  - **市值**: ${market_cap} (排名第{rank})
  - **24h交易量**: ${volume_24h}
  - **交易量/市值比**: {volume_ratio}%

  ### 市场评价
  （1-2段分析市场表现的关键趋势和驱动因素）
  ```

# 维度4：社区与热度分析
community_analysis_prompt: |
  ## 任务：生成社区与热度分析章节

  用户查询: {query}

  Twitter数据:
  {twitter_data}

  Reddit数据:
  {reddit_data}

  新闻数据:
  {news_data}

  要求：
  - 评估社区规模和活跃度
  - 分析社交媒体热度和情绪
  - 总结近期重要新闻和讨论
  - 评估社区增长趋势

  输出格式：
  ```markdown
  ## 社区与热度分析

  ### 社交媒体表现
  **Twitter**:
  - 关注者: {followers}
  - 24h提及: {mentions}
  - 参与度: {engagement}

  **Reddit**:
  - 订阅者: {subscribers}
  - 活跃用户: {active_users}
  - 讨论热度: {posts_count}

  ### 市场情绪
  - **Twitter情绪得分**: {twitter_sentiment} ({sentiment_label})
  - **Reddit情绪得分**: {reddit_sentiment} ({sentiment_label})
  - **综合情绪**: {overall_sentiment}

  ### 热门话题
  （列出近期的热门讨论话题和新闻）

  1. ...
  2. ...

  ### 社区评价
  （1-2段总结社区活跃度和市场关注度）
  ```

# 维度5：风险评估
risk_assessment_prompt: |
  ## 任务：生成风险评估章节

  用户查询: {query}

  项目信息:
  {project_info}

  市场数据:
  {market_data}

  链上数据:
  {onchain_data}

  新闻数据:
  {news_data}

  要求：
  - 识别项目面临的主要风险
  - 评估风险等级和影响程度
  - 提供风险缓解建议
  - 保持客观和谨慎的态度

  输出格式：
  ```markdown
  ## 风险评估

  ### 技术风险
  **风险等级**: {level}
  - ...（具体风险点）

  ### 市场风险
  **风险等级**: {level}
  - 价格波动风险: ...
  - 流动性风险: ...
  - 市场竞争: ...

  ### 监管风险
  **风险等级**: {level}
  - ...（合规性和监管政策风险）

  ### 其他风险
  - 团队风险: ...
  - 项目进展风险: ...

  ### 综合风险评级
  **总体风险**: {overall_risk_level}

  **投资者提示**:
  （1-2段风险警示和建议）
  ```

# 维度6：竞品对比
competitor_analysis_prompt: |
  ## 任务：生成竞品对比分析章节

  用户查询: {query}

  目标项目数据:
  {target_project}

  竞品列表:
  {competitors}

  要求：
  - 识别主要竞争对手（同类别项目）
  - 对比关键指标（市值、用户数、功能等）
  - 分析目标项目的竞争优势和劣势
  - 评估市场定位和差异化

  输出格式：
  ```markdown
  ## 竞品对比分析

  ### 主要竞争对手
  （列出2-3个主要竞品及其定位）

  1. **{competitor_1}**: {description}
  2. **{competitor_2}**: {description}

  ### 关键指标对比

  | 指标 | {target} | {competitor_1} | {competitor_2} |
  |------|----------|----------------|----------------|
  | 市值 | ... | ... | ... |
  | 价格 | ... | ... | ... |
  | 24h交易量 | ... | ... | ... |
  | 社区规模 | ... | ... | ... |

  ### 竞争优势
  - ...
  - ...

  ### 竞争劣势
  - ...
  - ...

  ### 市场定位
  （1-2段分析目标项目在竞争格局中的位置）
  ```

# 完整报告结构
full_report_structure: |
  # {project_name} 深度研究报告

  **生成时间**: {timestamp}
  **分析师**: Web3 Search AI

  ---

  ## TL;DR
  {tldr_summary}

  ---

  {overview_section}

  ---

  {technical_analysis_section}

  ---

  {market_analysis_section}

  ---

  {community_analysis_section}

  ---

  {risk_assessment_section}

  ---

  {competitor_analysis_section}

  ---

  ## 结论

  ### 关键发现
  - ...
  - ...
  - ...

  ### 投资建议
  （保守/中性/积极，附带理由）

  ---

  {disclaimer}

  ---

  ## 数据来源
  - CoinGecko
  - Etherscan/BSCScan
  - Twitter
  - Reddit
  - CryptoPanic

  **报告生成耗时**: {generation_time}秒
  **使用模型**: {models_used}
