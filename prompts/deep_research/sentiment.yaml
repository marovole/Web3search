# ================================
# 模型配置
# ================================
model_config:
  primary_model: "qwen/qwen3-30b-a3b:free"
  fallback_model: "qwen/qwen3-30b-a3b:free"  # 情绪分析用30b模型
  temperature: 0.4  # 适中温度，平衡创造性和准确性
  max_tokens: 2000
  response_format: "json_object"
