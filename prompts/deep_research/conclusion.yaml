output_format:
  executive_summary:
    one_sentence_thesis: "核心投资论点"
    bull_thesis: "看涨论点列表（3-5个）"
    bear_thesis: "看跌论点列表（3-5个）"
    key_assumptions: "关键假设列表（2-3个）"
    invalidation_triggers: "论点失效触发列表（2-3个）"

  investment_outlook:
    short_term: "1-2周观点"
    medium_term: "1-2月观点"

  key_metrics_to_watch:
    - metric: "指标名称"
      current_value: "当前值"
      target: "目标值"
      importance: "重要性"
      rationale: "原因"

  confidence_assessment:
    overall_confidence: "置信度分数（0-100）"
    confidence_level: "置信度等级"
    data_quality: "数据质量"
    analysis_completeness: "分析完整性"
    uncertainty_factors: "不确定因素列表"
    confidence_rationale: "置信度理由"

  investment_recommendation:
    rating: "投资评级"
    action: "操作建议"
    position_sizing: "仓位建议"
    entry_strategy: "入场策略"
    exit_strategy: "出场策略"
    risk_management: "风险管理措施"
    suitable_for: "适合人群"
    not_suitable_for: "不适合人群"

  catalyst_calendar:
    - date: "日期"
      event: "事件"
      impact: "影响程度"
      expected_outcome: "预期结果"

  comparative_analysis:
    vs_competitors: "相对竞品"
    vs_sector: "相对板块"
    vs_market: "相对市场"

  final_verdict:
    verdict: "最终判断"
    conviction_level: "信念程度"
    time_horizon: "投资期限"
    expected_return: "预期收益"
    max_drawdown_risk: "最大回撤风险"
    risk_reward_ratio: "风险回报比"
    summary: "总结"

validation_rules:
  required_fields:
    - executive_summary
    - investment_outlook
    - key_metrics_to_watch
    - confidence_assessment
    - investment_recommendation
    - catalyst_calendar
    - comparative_analysis
    - final_verdict

  executive_summary_rules:
    - bull_thesis必须包含3-5个论点
    - bear_thesis必须包含3-5个论点
    - key_assumptions必须包含2-3个假设
    - invalidation_triggers必须包含2-3个触发条件

  investment_outlook_rules:
    - short_term和medium_term必须包含view、price_target、key_events、rationale
    - view必须是"看涨/中性/看跌"之一

  key_metrics_to_watch_rules:
    - 必须包含5个关键指标
    - 每个指标必须有metric、current_value、target、importance、rationale
    - importance必须是"极高/高/中/低"之一

  confidence_assessment_rules:
    - overall_confidence必须在0-100之间
    - confidence_level必须是"高/中/低"之一
    - data_quality必须是"优秀/良好/一般/差"之一

  investment_recommendation_rules:
    - rating必须是"强烈看涨/看涨/中性/看跌/强烈看跌"之一
    - action必须是预定义操作之一
    - 必须包含risk_management列表

  final_verdict_rules:
    - verdict必须是"强烈看涨/看涨/中性/看跌/强烈看跌"之一
    - conviction_level必须是"极高/高/中/低"之一
    - risk_reward_ratio必须是正数

