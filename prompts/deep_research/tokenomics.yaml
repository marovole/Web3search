        misalignment_concerns:
          - "代币持有者无法直接获得协议收入（费用开关未激活）"
          - "协议收入增长不直接转化为代币价值"
          - "治理参与度低，治理权价值未体现"
          - "缺乏'飞轮效应'机制"

      tokenomics_health_score:
        score: 65
        rating: "良好 (60-79)"
        strengths:
          - "无通胀压力（已停止增发）"
          - "社区分配占比行业最高（43%）"
          - "解锁压力小（12个月仅5%流通量）"
          - "团队投资人长期锁定（4年）"
          - "协议收入强劲，费用开关激活潜力大"
        weaknesses:
          - "费用开关未激活，代币无直接价值捕获"
          - "治理权需求有限（参与率仅20%）"
          - "缺乏强制性代币需求（无质押、无回购）"
          - "激励对齐度低（持有者不分享协议收入）"

      summary: "UNI的代币经济学设计注重去中心化和公平分配（社区43%），但价值捕获机制薄弱。费用开关未激活导致协议收入无法分配给代币持有者，主要依赖治理权和未来费用开关预期。解锁压力小，无通胀风险，但缺乏'飞轮效应'机制限制了代币价值增长。"

