    fairness_rationale: "公平性理由"

  unlock_schedule:
    upcoming_unlocks: "即将解锁列表"
    next_6months_unlock: "未来6个月解锁总量"
    next_12months_unlock: "未来12个月解锁总量"
    unlock_pressure: "解锁压力等级"
    pressure_rationale: "压力评估理由"

  value_capture:
    mechanisms: "价值捕获机制列表"
    revenue_share_to_holders: "收入分配比例"
    deflationary: "是否通缩"
    flywheel_effect: "飞轮效应强度"
    flywheel_description: "飞轮效应描述"

  token_utility:
    use_cases: "使用场景列表"
    demand_drivers: "需求驱动因素"
    utility_score: "实用性分数（0-10）"
    utility_rating: "实用性评级"

  inflation_deflation:
    current_inflation_rate: "当前通胀率"
    future_inflation_rate: "未来通胀率"
    deflation_mechanisms: "通缩机制列表"
    net_inflation: "净通胀率"
    inflation_vs_revenue_growth: "通胀vs收入增长对比"
    sustainability: "可持续性"

  risk_assessment:
    tokenomics_risks: "代币经济学风险列表"
    death_spiral_risk: "死亡螺旋风险等级"
    risk_rationale: "风险评估理由"
    mitigation_factors: "风险缓解因素"

  incentive_alignment:
    aligned_with_protocol_success: "是否与协议成功对齐"
    alignment_score: "对齐分数（0-10）"
    alignment_factors: "对齐因素列表"
    misalignment_concerns: "不对齐担忧列表"

  tokenomics_health_score:
    score: "健康分数（0-100）"
    rating: "健康评级"
    strengths: "优势列表"
    weaknesses: "劣势列表"

  summary: "简洁总结"

validation_rules:
  required_fields:
    - supply_structure
    - unlock_schedule
    - value_capture
    - token_utility
    - inflation_deflation
    - risk_assessment
    - incentive_alignment
    - tokenomics_health_score
    - summary

  supply_structure_rules:
    - circulation_rate必须在0-100之间
    - distribution_fairness必须是"公平/中等/集中"之一
    - allocation_breakdown必须包含至少2个分配项

  unlock_schedule_rules:
    - upcoming_unlocks必须是列表
    - unlock_pressure必须是"高/中/低"之一
    - next_6months_unlock和next_12months_unlock必须是数字

  value_capture_rules:
    - mechanisms必须包含至少1个机制
    - deflationary必须是布尔值
    - flywheel_effect必须是"强/中/弱"之一

  token_utility_rules:
    - use_cases必须包含至少2个场景
    - utility_score必须在0-10之间
    - utility_rating必须是"强/中/弱"之一

  inflation_deflation_rules:
    - sustainability必须是"可持续/需观察/不可持续"之一

  risk_assessment_rules:
    - tokenomics_risks必须包含至少2个风险
    - death_spiral_risk必须是"低/中/高"之一

  incentive_alignment_rules:
    - aligned_with_protocol_success必须是布尔值
    - alignment_score必须在0-10之间

  tokenomics_health_score_rules:
    - score必须在0-100之间
    - rating必须是预定义评级之一
    - strengths必须包含至少2个优势
    - weaknesses必须包含至少2个劣势

examples:
