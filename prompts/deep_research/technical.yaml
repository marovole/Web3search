# ================================
# 技术面分析提示词模板
# 参考：openspec/changes/add-crypto-ai-search-platform/specs/ai-analysis/spec.md
# Scenario: 技术面分析
# ================================

system_prompt: |
  你是一位专业的加密货币技术分析师，擅长使用技术指标、图表形态和衍生品数据来判断市场趋势和交易机会。
  你的任务是分析价格走势、技术指标、支撑阻力位和衍生品市场数据，提供客观的技术面评估。

user_prompt_template: |
  请对 **{symbol}** 进行技术面分析：

  # 基本信息
  - 项目名称：{project_name}
  - 当前价格：${current_price}
  - 24h价格变化：{price_change_24h}%

  ---

  ## 价格数据

  ### 当前价格
  - 当前价格：${current_price}
  - 24h最高：${high_24h}
  - 24h最低：${low_24h}
  - 24h成交量：${volume_24h}

  ### 历史价格（用于技术指标计算）
  - 7日价格序列：{price_history_7d}
  - 30日价格序列：{price_history_30d}

  ### 价格变化
  - 24h变化：{price_change_24h}%
  - 7d变化：{price_change_7d}%
  - 30d变化：{price_change_30d}%

  ---

  ## 技术指标

  ### RSI（相对强弱指标，14周期）
  - RSI值：{rsi_value}
  - 解读：
    - RSI > 70: 超买区域，可能回调
    - RSI < 30: 超卖区域，可能反弹
    - 30-70: 正常区间

  ### MACD（移动平均收敛/发散）
  - MACD线：{macd_line}
  - 信号线：{macd_signal}
  - 柱状图：{macd_histogram}
  - 解读：
    - MACD > 信号线：看涨信号
    - MACD < 信号线：看跌信号
    - 柱状图由负转正：买入信号
    - 柱状图由正转负：卖出信号

  ### 布林带（20日，2倍标准差）
  - 上轨：${bollinger_upper}
  - 中轨：${bollinger_middle}
  - 下轨：${bollinger_lower}
  - 当前位置：{bollinger_position}
  - 带宽：{bollinger_width}
  - 解读：
    - 价格触及上轨：可能超买
    - 价格触及下轨：可能超卖
    - 布林带收窄：波动率降低，可能酝酿大行情

  ---

  ## 支撑与阻力位

  ### 关键价格水平（基于历史高低点）
  - 即时支撑位：{immediate_support}
  - 即时阻力位：{immediate_resistance}
  - 强支撑位：{strong_support}
  - 强阻力位：{strong_resistance}

  ### 历史关键价格
  - 历史最高价（ATH）：${ath_price}（距离：{ath_distance}%）
  - 历史最低价（ATL）：${atl_price}（距离：{atl_distance}%）

  ---

  ## 衍生品市场数据

  ### 未平仓合约（Open Interest）
  - 当前OI：${open_interest_value}
  - 24h变化：{open_interest_change_24h}%
  - 解读：
    - OI上升 + 价格上涨：看涨趋势强劲
    - OI上升 + 价格下跌：看跌趋势强劲
    - OI下降：趋势可能逆转

  ### 资金费率（Funding Rate）
  - 当前资金费率：{funding_rate}%
  - 解读：
    - 正费率且高：多头过热，空头收取费用
    - 负费率且低：空头过热，多头收取费用
    - 接近0：市场平衡

  ### 清算数据
  - 24h多头清算：${long_liquidations_24h}
  - 24h空头清算：${short_liquidations_24h}
  - 清算风险：{liquidation_risk}
  - 解读：大量清算可能引发瀑布/拉升

  ---

  ## 输出要求

  请按照以下**JSON格式**输出分析结果：

  ```json
