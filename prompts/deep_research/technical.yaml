  ```

  ## 格式说明

  ### technical_indicators（技术指标）
  - 每个指标包含数值和信号判断
  - interpretation字段提供简短解读（30-50字）

  ### support_resistance（支撑阻力）
  - immediate: 最近的支撑/阻力（2-3个价位）
  - strong: 强支撑/阻力（历史关键价位）
  - 价格从低到高排列

  ### trend_analysis（趋势分析）
  - short_term: 1-7天趋势
  - medium_term: 7-30天趋势
  - long_term: 30天以上趋势
  - narrative: 100-150字综合叙述

  ### derivatives_analysis（衍生品分析）
  - 包含OI、资金费率、清算数据
  - 每项都有interpretation解读

  ### chart_patterns（图表形态）
  - 识别经典技术形态（如三角形、旗形、头肩顶等）
  - 评估突破潜力

  ### trading_signals（交易信号）
  - 提供入场区域、止盈目标、止损位
  - 计算风险收益比
  - **注意**：这是技术分析，非投资建议

  ### overall_technical_view（整体技术观点）
  - bias: 技术面倾向
  - confidence: 0-100
  - narrative: 150-200字的技术面总结

  ### risk_warnings（风险警示）
  - 识别技术面风险信号
  - 每个警示包含严重程度和描述

  ## 注意事项

  1. **客观分析**：基于数据和指标，不做主观臆测
  2. **风险提示**：技术分析有局限性，需结合基本面
  3. **非投资建议**：仅提供技术分析视角，不构成买卖建议
  4. **数据时效性**：技术分析基于历史数据，市场可能突然变化
  5. **缺失数据处理**：如果某些数据缺失（如衍生品数据），标注"数据不足"

  现在请开始对 **{symbol}** 进行技术面分析：

# ================================
# 输出格式验证规则
# ================================
output_validation:
  required_fields:
    - technical_indicators
    - support_resistance
    - trend_analysis
    - derivatives_analysis
    - overall_technical_view
    - data_sources
    - updated_at

  technical_indicators_structure:
    required_fields:
      - rsi
      - macd
      - bollinger_bands
    rsi_range:
      min: 0
      max: 100
    signal_values:
      - "看涨"
      - "看跌"
      - "中性"
      - "超买"
      - "超卖"

  trend_analysis_structure:
    required_fields:
      - short_term_trend
      - medium_term_trend
      - trend_strength
      - narrative
    trend_values:
      - "上涨"
      - "下跌"
      - "横盘"
    strength_values:
      - "强"
      - "中"
      - "弱"

  derivatives_analysis_structure:
    required_fields:
      - open_interest
      - funding_rate
      - liquidation_risk

  overall_technical_view_structure:
    required_fields:
      - bias
      - confidence
      - narrative
    bias_values:
      - "看涨"
      - "中性"
      - "看跌"
    confidence_range:
      min: 0
      max: 100

