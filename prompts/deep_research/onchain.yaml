# ================================
# 链上数据分析提示词模板
# 参考：openspec/changes/add-crypto-ai-search-platform/specs/ai-analysis/spec.md
# Scenario: 链上数据分析（基本面）
# ================================

system_prompt: |
  你是一位专业的区块链链上数据分析师，擅长解读链上活动、协议基本面和持币分布，评估项目的真实使用情况和价值捕获能力。
  你的任务是分析用户活动、协议收入、TVL、持币集中度等链上指标，提供客观的基本面评估。

user_prompt_template: |
  请对 **{symbol}** 进行链上数据分析（基本面分析）：

  # 基本信息
  - 项目名称：{project_name}
  - 当前价格：${current_price}
  - 市值：${market_cap}
  - 市值排名：#{market_cap_rank}

  ---

  ## 用户活动指标

  ### 活跃地址
  - 24h活跃地址：{active_addresses_24h}
  - 7d活跃地址：{active_addresses_7d}
  - 30d活跃地址：{active_addresses_30d}
  - 活跃地址变化趋势：{active_addresses_trend}

  ### 累计用户
  - 累计唯一地址数：{total_unique_addresses}
  - 30d新增地址：{new_addresses_30d}
  - 新用户增长率：{new_user_growth_rate}%

  ### 交易活动
  - 24h交易数：{transactions_24h}
  - 7d平均交易数：{avg_transactions_7d}
  - 30d交易总数：{total_transactions_30d}
  - 交易量趋势：{transaction_trend}

  ---

  ## 协议基本面（适用于DeFi/Layer1/Layer2）

  ### 锁定价值（TVL）
  - 当前TVL：${current_tvl}
  - 30d TVL变化：{tvl_change_30d}%
  - 90d TVL变化：{tvl_change_90d}%
  - TVL排名：#{tvl_rank}

  ### 协议收入
  - 30d协议费用：${protocol_fees_30d}
  - 30d协议收入：${protocol_revenue_30d}
  - 年化收入（估算）：${annualized_revenue}
  - 收入增长率：{revenue_growth_rate}%

  ### 收入分配
  - 质押者分成：{staker_share}%
  - 国库/回购：{treasury_buyback_share}%
  - 燃烧：{burn_share}%
  - 团队/开发者：{team_share}%

  ### 回购/燃烧活动
  - 30d回购金额：${buyback_amount_30d}
  - 30d燃烧数量：{burn_amount_30d} {symbol}
  - 回购/燃烧对供应的影响：{supply_impact}%

  ---

  ## 持币分布与鲸鱼活动

  ### 持币集中度
  - Top 10持币者占比：{top_10_holders_pct}%
  - Top 100持币者占比：{top_100_holders_pct}%
  - 基尼系数：{gini_coefficient}（0=完全平等，1=完全集中）
  - 集中度评级：{concentration_rating}

  ### 鲸鱼活动（持仓>$1M的地址）
  - 鲸鱼地址数量：{whale_count}
  - 鲸鱼总持仓占比：{whale_holdings_pct}%
  - 30d鲸鱼净流入/流出：{whale_net_flow_30d} {symbol}
  - 鲸鱼活动趋势：{whale_activity_trend}

  ### 机构持币者
  - 已知机构地址数量：{institutional_addresses}
  - 机构持币总量：{institutional_holdings} {symbol}
  - 机构持币占比：{institutional_holdings_pct}%
  - 主要机构：{major_institutions}

  ### 交易所余额
  - 交易所总余额：{exchange_balance} {symbol}
  - 交易所余额占比：{exchange_balance_pct}%
  - 30d交易所净流入/流出：{exchange_net_flow_30d} {symbol}
  - 解读：流出表示投资者提币到钱包（看涨），流入表示准备卖出（看跌）

  ---

  ## 输出要求

  请按照以下**JSON格式**输出分析结果：

