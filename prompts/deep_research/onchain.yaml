  ## 格式说明

  ### user_activity（用户活动）
  - active_addresses: 活跃地址数据和趋势
  - new_users: 新用户增长数据
  - transaction_activity: 交易活动数据
  - overall_narrative: 100-150字的用户活动总结

  ### protocol_fundamentals（协议基本面）
  - tvl: TVL数据和变化趋势
  - revenue: 收入数据和增长率
  - revenue_distribution: 收入分配模型
  - buyback_burn: 回购和燃烧数据
  - valuation_metrics: 估值指标（MC/TVL、P/E等）
  - overall_narrative: 150-200字的基本面总结

  ### token_distribution（持币分布）
  - concentration: 持币集中度和基尼系数
  - whale_activity: 鲸鱼活动和趋势
  - institutional_holders: 机构持币情况
  - exchange_balance: 交易所余额和流向
  - overall_narrative: 100-150字的持币分布总结

  ### onchain_health_score（链上健康度评分）
  - score: 0-100分
  - rating: 优秀(80+)、良好(60-79)、一般(40-59)、差(<40)
  - strengths: 优势点（3-5条）
  - weaknesses: 劣势点（1-3条）
  - outlook: 未来展望（50-100字）

  ## 估值指标说明

  ### MC/TVL（市值/锁定价值）
  - < 0.5: 估值偏低，可能被低估
  - 0.5-1.5: 合理估值区间
  - > 1.5: 估值偏高，可能被高估

  ### P/E（市盈率）
  - 计算：市值 / 年化收入
  - < 20: 估值合理
  - 20-50: 增长溢价
  - > 50: 估值偏高

  ### P/S（市销率）
  - 计算：市值 / 年化费用
  - 用于尚未盈利的协议

  ## 注意事项

  1. **真实性验证**：区分真实用户和机器人/刷量地址
  2. **数据时效性**：链上数据更新频率高，注意数据时间戳
  3. **跨链分析**：多链部署的项目需要汇总所有链的数据
  4. **收入质量**：区分可持续收入和一次性收入
  5. **鲸鱼识别**：识别交易所、团队、基金会等非真实鲸鱼
  6. **缺失数据处理**：某些指标可能不适用（如非DeFi项目无TVL），标注"N/A"

  现在请开始对 **{symbol}** 进行链上数据分析：

# ================================
# 输出格式验证规则
# ================================
output_validation:
  required_fields:
    - user_activity
    - protocol_fundamentals
    - token_distribution
    - onchain_health_score
    - data_sources
    - updated_at

  user_activity_structure:
    required_fields:
      - active_addresses
      - new_users
      - transaction_activity
      - overall_narrative

  protocol_fundamentals_structure:
    required_fields:
      - tvl
      - revenue
      - revenue_distribution
      - valuation_metrics
      - overall_narrative

  token_distribution_structure:
    required_fields:
      - concentration
      - whale_activity
      - exchange_balance
      - overall_narrative

  onchain_health_score_structure:
    required_fields:
      - score
      - rating
      - strengths
      - weaknesses
      - outlook
    score_range:
      min: 0
      max: 100
    rating_values:
      - "优秀"
      - "良好"
      - "一般"
      - "差"

