services:
  # Web API服务
  - type: web
    name: web3search-api
    env: python
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: OPENROUTER_API_KEY
        sync: false  # 需要在Render控制台手动设置
      - key: DATABASE_URL
        fromDatabase:
          name: web3search-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      # 注意：Redis 配置已禁用，因为 Render 免费计划不支持 Redis
      # 应用将在没有缓存层的情况下运行（对 Staging 验证足够）
      # 后续升级时可以：
      # 1. 升级 Render 计划获得 Redis 支持
      # 2. 或改用 Redis Cloud 等第三方服务
  # 注意：Celery Worker 和 Beat 服务在 Render 免费计划中不支持
  # 需要升级到付费计划才能使用 type: worker
  # 临时说明：当前仅部署 Web API + 数据库以验证 Staging 环境
  # 后续计划：
  # 1. 升级 Render 计划至标准版或以上
  # 2. 或改用第三方服务处理后台任务（如 AWS Lambda、Google Cloud Functions）

databases:
  # PostgreSQL数据库
  - name: web3search-db
    plan: free
    databaseName: web3search
    user: web3search

  # 注意：Redis 已从免费计划中移除
  # Render 免费计划不支持 Redis，需要升级到付费计划
  # 应用将在没有 Redis 缓存的情况下运行
