services:
  # Web API服务
  - type: web
    name: web3search-api
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: OPENROUTER_API_KEY
        sync: false  # 需要在Render控制台手动设置
      - key: DATABASE_URL
        fromDatabase:
          name: web3search-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: web3search-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.11.0

  # Celery Worker（可选）
  - type: worker
    name: web3search-worker
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && celery -A app.tasks.celery_app worker --loglevel=info
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: web3search-db
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: web3search-redis
          property: connectionString

databases:
  # PostgreSQL数据库
  - name: web3search-db
    plan: free
    databaseName: web3search
    user: web3search

  # Redis缓存
  - name: web3search-redis
    plan: free
